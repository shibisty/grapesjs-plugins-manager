<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>grapesjs-plugins-manager — dev</title>
    <link rel="stylesheet" href="/node_modules/grapesjs/dist/css/grapes.min.css" />
    <style>
      html, body { margin: 0; height: 100%; }
    </style>
  </head>
  <body>
    <div id="gjs"></div>
    <script type="module">
      import grapesjs from 'grapesjs';
      import pluginsManager, { loadPlugins } from './src/index.ts';

      function demoPlugin(editor) {
        editor.Blocks.add('demo-block', { label: 'Demo', content: '<p>Demo block</p>' });
      }

      const plugins = await loadPlugins([pluginsManager, demoPlugin]);
      window.editor = grapesjs.init({
        container: '#gjs',
        height: '100%',
        storageManager: false,
        components: '<h1>Plugin manager demo</h1><p>Use the puzzle button in the toolbar.</p>',
        plugins,
      });
    </script>
  </body>
</html>
